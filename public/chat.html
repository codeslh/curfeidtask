<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Canlı Destek</title>
  <link rel="stylesheet" href="/styles.css">
  <link rel="stylesheet" href="/chat.css">
  <link rel="icon" href="/brand/kalfa-mark.svg" type="image/svg+xml">
</head>
<body class="chat-page">
  <div class="widget">
    <header class="w-head">
      <span class="logo"><svg class="brand-glyph" viewBox="0 0 64 64" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v34"/><path d="M21 37 36 22"/><path d="M29.5 29.5 44 49"/></g><path fill="currentColor" d="M45 9c.9 4.6 2.9 6.6 7.5 7.5-4.6.9-6.6 2.9-7.5 7.5-.9-4.6-2.9-6.6-7.5-7.5 4.6-.9 6.6-2.9 7.5-7.5z"/></svg></span>
      <div class="w-title"><b id="title">Canlı destek</b><small><span class="online"></span>Çevrimiçi · genellikle birkaç dakikada yanıt verir</small></div>
    </header>

    <form id="start" class="w-start">
      <h1>Merhaba 👋</h1>
      <p class="muted">Web sitesi, e-ticaret veya özel yazılım ihtiyacınızı anlatın; size hemen fiyat ve örnek gösterelim.</p>
      <label class="field">Adınız<input name="name" required autocomplete="name" placeholder="Adınız soyadınız"></label>
      <label class="field">E-posta <small>İsteğe bağlı — size dönüş yapabilmemiz için</small><input name="email" type="email" autocomplete="email" placeholder="ornek@mail.com"></label>
      <button class="btn primary lg">Sohbete başla
        <svg class="i" aria-hidden="true"><use href="/assets/icons.svg#send"/></svg></button>
    </form>

    <div id="chat" class="w-chat" hidden>
      <div class="messages" id="msgs" aria-live="polite"></div>
      <div class="w-chips" id="sc"></div>
      <form id="send" class="w-compose">
        <input id="text" placeholder="Mesajınızı yazın…" autocomplete="off" aria-label="Mesaj">
        <button class="btn primary send-btn" aria-label="Gönder"><svg class="i" aria-hidden="true"><use href="/assets/icons.svg#send"/></svg></button>
      </form>
      <div class="w-foot">Kalfa ile çalışır · gerekirse bir yetkiliye aktarılırsınız</div>
    </div>
  </div>
  <script type="module" src="/chat.js"></script>
</body>
</html>
