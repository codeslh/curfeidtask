<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Canlı Destek</title>
  <link rel="stylesheet" href="/styles.css">
  <link rel="stylesheet" href="/chat.css">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22%3E%3Crect width=%2216%22 height=%2216%22 rx=%224%22 fill=%22%235b4cf0%22/%3E%3C/svg%3E">
</head>
<body class="chat-page">
  <div class="widget">
    <header class="w-head">
      <span class="logo"><svg class="i" aria-hidden="true"><use href="/assets/icons.svg#sparkles"/></svg></span>
      <div class="w-title"><b id="title">Canlı destek</b><small><span class="online"></span>Çevrimiçi · genellikle birkaç dakikada yanıt verir</small></div>
    </header>

    <form id="start" class="w-start">
      <h1>Merhaba 👋</h1>
      <p class="muted">Web sitesi, e-ticaret veya özel yazılım ihtiyacınızı anlatın; size hemen fiyat ve örnek gösterelim.</p>
      <label>Adınız<input name="name" required autocomplete="name"></label>
      <label>E-posta <span class="muted">(isteğe bağlı)</span><input name="email" type="email" autocomplete="email"></label>
      <button class="primary">Sohbete başla
        <svg class="i" aria-hidden="true"><use href="/assets/icons.svg#send"/></svg></button>
    </form>

    <div id="chat" class="w-chat" hidden>
      <div class="messages" id="msgs" aria-live="polite"></div>
      <div class="w-chips" id="sc"></div>
      <form id="send" class="w-compose">
        <input id="text" placeholder="Mesajınızı yazın…" autocomplete="off" aria-label="Mesaj">
        <button class="primary send-btn" aria-label="Gönder"><svg class="i" aria-hidden="true"><use href="/assets/icons.svg#send"/></svg></button>
      </form>
    </div>
  </div>
  <script type="module" src="/chat.js"></script>
</body>
</html>
