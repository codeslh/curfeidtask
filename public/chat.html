<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Canlı Destek</title>
  <link rel="stylesheet" href="/styles.css">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22%3E%3Crect width=%2216%22 height=%2216%22 rx=%224%22 fill=%22%232a78d6%22/%3E%3C/svg%3E">
  <style>
    body { display: flex; justify-content: center; }
    .wrap { width: 100%; max-width: 640px; padding: 16px; }
    .messages { height: calc(100vh - 260px); }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <h1 id="title">Canlı destek</h1>
      <form id="start">
        <p class="muted">Size nasıl yardımcı olabiliriz? Sohbete başlamak için bilgilerinizi girin.</p>
        <label>Adınız<input name="name" required></label>
        <label>E-posta (isteğe bağlı)<input name="email" type="email"></label>
        <button class="primary">Sohbete başla</button>
      </form>
      <div id="chat" hidden>
        <div class="messages" id="msgs"></div>
        <div class="shortcuts" id="sc"></div>
        <form id="send" class="row"><input id="text" placeholder="Mesajınızı yazın..." autocomplete="off" style="flex:1"><button class="primary">Gönder</button></form>
      </div>
    </div>
  </div>
  <script type="module" src="/chat.js"></script>
</body>
</html>
